name: Deploy SQL to Databricks

on:
  workflow_dispatch:
    inputs:
      schema_name:
        description: 'Schema name to check/create'
        required: true
        default: 'my_schema'
      sql_path:
        description: 'Path to SQL files'
        required: true
        default: 'sql'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install new Databricks CLI
      run: |
        pip install databricks
        echo "export PATH=$HOME/.local/bin:\$PATH" >> $GITHUB_ENV

    - name: Authenticate with Databricks
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      run: |
        ~/.local/bin/databricks configure --host $DATABRICKS_HOST --token <<< "$DATABRICKS_TOKEN"

    - name: Check and Create Schema
      env:
        WAREHOUSE_ID: ${{ secrets.WAREHOUSE_ID }}
      run: |
        SCHEMA_NAME="${{ github.event.inputs.schema_name }}"
        CATALOG_NAME="suresh_hus"

        EXISTS=$(~/.local/bin/databricks sql warehouses query --warehouse-id $WAREHOUSE_ID \
          --sql "SHOW SCHEMAS IN $CATALOG_NAME" | grep $SCHEMA_NAME || true)

        if [ -z "$EXISTS" ]; then
          echo "Creating schema $SCHEMA_NAME..."
          ~/.local/bin/databricks sql warehouses query --warehouse-id $WAREHOUSE_ID \
            --sql "CREATE SCHEMA $CATALOG_NAME.$SCHEMA_NAME"
        else
          echo "Schema $SCHEMA_NAME already exists."
        fi

    - name: Deploy SQL Files
      env:
        WAREHOUSE_ID: ${{ secrets.WAREHOUSE_ID }}
      run: |
        SQL_PATH="${{ github.event.inputs.sql_path }}"
        for file in $SQL_PATH/*.sql; do
          echo "Executing $file..."
          ~/.local/bin/databricks sql warehouses query --warehouse-id $WAREHOUSE_ID \
            --sql "$(cat $file)"
        done
